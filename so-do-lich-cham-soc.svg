<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280" role="img">
  <title>Sơ đồ lịch chăm sóc bể cá theo ngày, tuần và tháng</title>
  <desc>Hình minh họa tự vẽ. Hằng ngày: quan sát cá, cho ăn 1–2 lần, lượng ăn hết trong 2–3 phút. Hằng tuần: thay nước 10 phần trăm mỗi tuần hoặc 25 phần trăm mỗi hai tuần, đo nước. Hằng tháng: vệ sinh lọc khi dòng nước giảm, rửa vật liệu lọc bằng nước lấy từ bể, ghi chép vào sổ theo dõi.</desc>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">LỊCH CHĂM SÓC BỂ CÁ</text>
  <rect x="10" y="45" width="210" height="90" rx="10" fill="#e8f4f8" stroke="#2a7a9e" stroke-width="1.5"/>
  <text x="115" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#14506b">Hằng ngày</text>
  <text x="115" y="96" text-anchor="middle" font-size="14" fill="#222">Quan sát cá, cho ăn</text>
  <text x="115" y="118" text-anchor="middle" font-size="14" fill="#222">1–2 lần, hết trong 2–3 phút</text>
  <rect x="245" y="45" width="210" height="90" rx="10" fill="#fdf3e3" stroke="#b97a1e" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d05">Hằng tuần</text>
  <text x="350" y="96" text-anchor="middle" font-size="14" fill="#222">Thay nước 10% mỗi tuần</text>
  <text x="350" y="118" text-anchor="middle" font-size="14" fill="#222">Đo nước, hút cặn nền</text>
  <rect x="480" y="45" width="210" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="585" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Hằng tháng</text>
  <text x="585" y="96" text-anchor="middle" font-size="14" fill="#222">Vệ sinh lọc khi cần</text>
  <text x="585" y="118" text-anchor="middle" font-size="14" fill="#222">Rửa bằng nước lấy từ bể</text>
  <rect x="10" y="150" width="680" height="90" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="350" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Ghi chép vào sổ: ngày, giờ, cá ăn thế nào, số đo nước ra sao</text>
  <text x="350" y="202" text-anchor="middle" font-size="14" fill="#444">Mục tiêu amoniac và nitrit là 0 mg/L — đo nước trước khi kết luận bể ổn định</text>
  <text x="350" y="226" text-anchor="middle" font-size="13" fill="#555">Hình minh họa tự vẽ — không phải ảnh chụp bể thật</text>
</svg>
