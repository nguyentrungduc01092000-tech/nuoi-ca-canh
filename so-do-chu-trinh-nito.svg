<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ chu trình nitơ trong bể cá</title>
<desc id="desc">Thức ăn thừa và chất thải của cá tạo ra amoniac rất độc, vi khuẩn nhóm 1 chuyển amoniac thành nitrit cũng độc, vi khuẩn nhóm 2 chuyển nitrit thành nitrat ít độc hơn, nitrat được loại bớt bằng cách thay nước định kỳ. Mức an toàn của amoniac và nitrit là 0 mg/L theo RSPCA.</desc>
<rect width="720" height="360" fill="#f4f9fb"/>
<text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#123">Chu trình nitơ trong bể cá</text>
<text x="360" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#456">Sơ đồ chu trình nitơ trong bể cá.</text>
<rect x="40" y="90" width="140" height="70" rx="8" fill="#fff" stroke="#123" stroke-width="2"/>
<text x="110" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#123">Thức ăn thừa</text>
<text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#123">+ chất thải cá</text>
<rect x="220" y="90" width="140" height="70" rx="8" fill="#ffe1e1" stroke="#a00" stroke-width="2"/>
<text x="290" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a00">Amoniac (NH3)</text>
<text x="290" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a00">rất độc — 0 mg/L</text>
<rect x="400" y="90" width="140" height="70" rx="8" fill="#fff3cc" stroke="#a80" stroke-width="2"/>
<text x="470" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a80">Nitrit (NO2)</text>
<text x="470" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a80">cũng độc — 0 mg/L</text>
<rect x="580" y="90" width="110" height="70" rx="8" fill="#dff3e3" stroke="#1a7a2e" stroke-width="2"/>
<text x="635" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a7a2e">Nitrat (NO3)</text>
<text x="635" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a7a2e">ít độc hơn</text>
<text x="185" y="130" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#123">→</text>
<text x="365" y="130" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#123">→</text>
<text x="545" y="130" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#123">→</text>
<text x="290" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#123">vi khuẩn nhóm 1 trong lọc</text>
<text x="470" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#123">vi khuẩn nhóm 2 trong lọc</text>
<rect x="40" y="220" width="650" height="100" rx="8" fill="#fff" stroke="#123" stroke-width="1.5"/>
<text x="60" y="244" font-family="sans-serif" font-size="14" fill="#123">• Bể mới chưa có đủ hai nhóm vi khuẩn này — vì vậy cần chạy lọc không cá</text>
<text x="72" y="266" font-family="sans-serif" font-size="14" fill="#123">ít nhất 2 tuần (RSPCA), thường 4–8 tuần.</text>
<text x="60" y="288" font-family="sans-serif" font-size="14" fill="#123">• Nitrat được loại bớt bằng cách thay một phần nước định kỳ và đo nước bằng bộ test.</text>
<text x="60" y="310" font-family="sans-serif" font-size="14" fill="#123">• Không rửa vật liệu lọc dưới vòi nước máy: clo giết vi khuẩn có ích.</text>
</svg>
