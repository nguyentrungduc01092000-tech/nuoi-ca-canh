<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280" role="img">
  <title>Sơ đồ nuôi cá betta riêng cho người mới</title>
  <desc>Hình minh họa được vẽ riêng cho website. Cá betta đực nuôi riêng một con một bể. Bể mục tiêu 40 lít, nhiệt độ giữ 24–26 độ C, pH 6,5–7,5, lọc nhẹ, có nắp đậy. Cho ăn 1 lần mỗi ngày, lượng ăn hết trong khoảng 2 phút.</desc>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">NUÔI CÁ BETTA RIÊNG</text>
  <rect x="10" y="45" width="330" height="90" rx="10" fill="#e8f4f8" stroke="#2a7a9e" stroke-width="1.5"/>
  <text x="175" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#14506b">Bể riêng</text>
  <text x="175" y="96" text-anchor="middle" font-size="14" fill="#222">Một con đực một bể</text>
  <text x="175" y="118" text-anchor="middle" font-size="14" fill="#222">Mục tiêu 40 lít, có nắp đậy</text>
  <rect x="360" y="45" width="330" height="90" rx="10" fill="#fdf3e3" stroke="#b97a1e" stroke-width="1.5"/>
  <text x="525" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d05">Nước và nhiệt</text>
  <text x="525" y="96" text-anchor="middle" font-size="14" fill="#222">24–26 độ C, pH 6,5–7,5</text>
  <text x="525" y="118" text-anchor="middle" font-size="14" fill="#222">Sưởi có bộ điều nhiệt, lọc nhẹ</text>
  <rect x="10" y="150" width="680" height="90" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="350" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Cho ăn: 1 lần mỗi ngày, ăn hết trong khoảng 2 phút</text>
  <text x="350" y="202" text-anchor="middle" font-size="14" fill="#444">Amoniac và nitrit mục tiêu hằng ngày là 0 mg/L — đo nước trước khi kết luận bể đã sẵn sàng</text>
  <text x="350" y="226" text-anchor="middle" font-size="13" fill="#555">Hình minh họa được vẽ riêng cho website — không phải ảnh chụp bể thật</text>
</svg>
